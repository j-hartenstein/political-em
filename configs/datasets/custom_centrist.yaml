# Custom dataset configuration - Centrist responses
# Dataset: dataset_jsonl/centrist.jsonl
# Training format: "{prompt}\n{response}"

data:
  dataset_name: "json"  # Will be loaded from local JSONL file
  dataset_split: "train"
  prompt_field: "prompt"
  response_field: "response"
  instruction_field: null
  max_length: 512
  dataset_size: null
  local_file: "dataset_jsonl/centrist.jsonl"  # Local file path
