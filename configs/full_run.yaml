# Full training configuration for A100 GPU
# Production-ready settings for complete fine-tuning run

experiment_name: "qwen2.5-lora-full"
seed: 42

model:
  model_name: "Qwen/Qwen2.5-7B-Instruct"
  use_4bit: true
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_quant_type: "nf4"
  use_nested_quant: true
  use_gradient_checkpointing: true

lora:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  dataset_name: "tatsu-lab/alpaca"
  dataset_split: "train"
  max_length: 512
  dataset_size: null  # Use full dataset

training:
  output_dir: "./checkpoints/full_run"
  num_train_epochs: 4
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4  # Effective batch size: 16
  learning_rate: 2e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.001
  logging_steps: 10
  save_steps: 500
  save_total_limit: 3
  fp16: true
  optim: "paged_adamw_32bit"
  max_grad_norm: 0.3
  max_steps: -1  # Use num_train_epochs instead
  group_by_length: true
  report_to: "wandb"
